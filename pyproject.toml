[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ai-financial-data-assistant"
version = "0.1.0"
description = "Vietnamese Text-to-Pandas for financial statements"
readme = "README.md"
requires-python = ">=3.10"
dependencies = ["pandas>=2.2"]

[project.optional-dependencies]
app = ["fastapi", "uvicorn", "streamlit"]
dev = ["pytest>=8"]
train = ["torch", "transformers", "peft", "accelerate", "bitsandbytes", "datasets"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
